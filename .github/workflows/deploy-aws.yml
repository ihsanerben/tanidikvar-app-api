name: Test and deploy API to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify API
        run: ./mvnw --batch-mode verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: tanidikvar-api-${{ github.run_id }}

      - name: Deploy through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail
          remote_command='set -eu; sudo -u ubuntu git -C /home/ubuntu/tanidikvar-app-api pull --ff-only origin main; cd /home/ubuntu/tanidikvar-app-api/deploy/aws; ./deploy.sh; for attempt in $(seq 1 30); do if curl -fsS https://api.tanidikvar.online/api/health; then exit 0; fi; sleep 5; done; echo "API health check timed out" >&2; exit 1'
          parameters="$(jq -cn --arg command "$remote_command" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy TanidikVar API ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM command: $command_id"
          set +e
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          wait_result=$?
          set -e
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text)"
          if [ "$wait_result" -ne 0 ] || [ "$status" != "Success" ]; then
            exit 1
          fi
