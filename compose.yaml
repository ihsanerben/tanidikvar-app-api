name: tanidikvar
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Run scripts/setup-local.sh first}
      POSTGRES_USER: ${DB_USERNAME:?Run scripts/setup-local.sh first}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-local.sh first}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
  api:
    profiles: [app]
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-14d}
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-noreply@tanidikvar.local}
      STORAGE_DIRECTORY: /app/storage
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    volumes:
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  api_storage:
  postgres_data:
