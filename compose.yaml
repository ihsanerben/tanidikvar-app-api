name: tanidikvar
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Run scripts/setup-local.sh first}
      POSTGRES_USER: ${DB_USERNAME:?Run scripts/setup-local.sh first}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-local.sh first}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
volumes:
  postgres_data:
