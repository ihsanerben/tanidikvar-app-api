services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      STORAGE_DIRECTORY: /app/storage
    expose:
      - "8080"
    volumes:
      - ./data:/app/storage
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
