services:
  - type: web
    name: tanidikvar-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PORT
        value: "10000"
      - key: COOKIE_SECURE
        value: "true"
      - key: MAIL_PROVIDER
        value: resend
      - key: PILOT_MODE
        value: "true"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
