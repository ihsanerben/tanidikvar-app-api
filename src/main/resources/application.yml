spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 11MB
  application:
    name: tanidikvar-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  mvc:
    log-resolved-exception: false
server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
app:
  pilot-mode: ${PILOT_MODE:false}
  storage-directory: ${STORAGE_DIRECTORY:.local/storage}
  catalog:
    programs-csv-url: ${PROGRAMS_CSV_URL:https://raw.githubusercontent.com/cngil/turkiye-university-programs/main/data/programs.csv}
    programs-csv-max-bytes: ${PROGRAMS_CSV_MAX_BYTES:104857600}
    programs-csv-timeout: ${PROGRAMS_CSV_TIMEOUT:120s}
  auth:
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:14d}
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    from: ${MAIL_FROM:noreply@tanidikvar.local}
    contact-recipient: ${CONTACT_RECIPIENT:tanidikvar@gmail.com}
    resend-api-key: ${RESEND_API_KEY:}
    resend-endpoint: ${RESEND_ENDPOINT:https://api.resend.com/emails}
  cors-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  secure-cookies: ${COOKIE_SECURE:true}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
